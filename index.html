<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Easy Street Camera</title>
  <meta http-equiv="refresh" content="60">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-top: 10px;
      margin-bottom: 20px;
      font-size: 24px;
    }

    img.rotated {
      transform: rotate(0deg);
      max-width: 100vw;
      max-height: 90vh;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Easy Street Camera</h1>
  <img src="latest.jpg" class="rotated" onclick="this.requestFullscreen()" />
</body>
</html>
