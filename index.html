<!DOCTYPE html>
<html>
<head>
  <title>Easy Street Camera</title>
  <meta http-equiv="refresh" content="30">
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #000;
      margin: 0;
    }
    img {
      max-width: 100%;
      max-height: 100vh;
      margin-top: 0;
      cursor: pointer;
    }
    h1 {
      color: white;
      margin: 10px;
    }
  </style>
</head>
<body>
  <h1>Easy Street Camera</h1>
  <img src="latest.jpg" alt="Latest Photo" onclick="toggleFullScreen(this)">
  <script>
    function toggleFullScreen(el) {
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(err => {
          alert(`Error attempting to enter fullscreen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
