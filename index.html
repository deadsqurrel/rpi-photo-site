<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Camera Photo</title>
  <meta http-equiv="refresh" content="30">
  <style>
    body {
      margin: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img.rotated {
      transform: rotate(180deg);
      max-width: 100vw;
      max-height: 100vh;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="latest.jpg" class="rotated" onclick="this.requestFullscreen()" />
</body>
</html>
